[package]
name = "schoolerp-desktop"
version = "0.1.0"
description = "SchoolERP desktop shell with an encrypted offline outbox"
authors = ["SchoolERP"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "schoolerp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
