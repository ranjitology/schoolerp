name: schoolerp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolerp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=8
      - -c
      - max_replication_slots=8
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolerp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schoolerp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schoolerp-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/schoolerp
        mc anonymous set none local/schoolerp
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schoolerp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schoolerp-dev-secret}

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command:
      - /bin/sh
      - -c
      - pnpm --filter @schoolerp/db migrate && pnpm --filter @schoolerp/db seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/schoolerp
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-32chars}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:-dev-only-refresh-pepper-change-me}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://erp_app:${ERP_APP_PASSWORD:-erp_app}@db:5432/schoolerp
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-32chars}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:-dev-only-refresh-pepper-change-me}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      ALLOW_TENANT_HEADER: "true"
      TRUST_PROXY: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: schoolerp
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-schoolerp}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-schoolerp-dev-secret}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  minio-data:
